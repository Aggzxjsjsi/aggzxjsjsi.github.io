<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Estimasi Tubuh (Wingspan)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #1a365d 0%, #0b0f19 50%);
        }

        .title-container { text-align: center; margin: 30px 0; }
        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            margin-bottom: 10px;
        }
        .subtitle { color: #cbd5e1; font-size: 0.95rem; }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .input-group label { font-size: 0.85rem; color: #94a3b8; }
        
        input, select {
            width: 100%;
            background: transparent;
            border: 1px solid #374151;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus { border-color: #38bdf8; }
        select option { background: #111827; color: white; }

        .file-upload-box {
            border: 2px dashed #374151;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: border 0.3s;
        }
        .file-upload-box:hover { border-color: #38bdf8; }
        .file-upload-box input { display: none; }
        .upload-text { font-size: 0.9rem; color: #94a3b8; }

        #preview-container {
            display: none;
            margin-bottom: 15px;
            text-align: center;
        }
        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            border: 1px solid #374151;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #1e3a8a 0%, #7f1d1d 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        #result-container { display: none; width: 100%; max-width: 450px; }
        
        .result-box {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 16px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            border: 1px solid #1f2937;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .stat-label { color: #cbd5e1; font-size: 0.9rem; }
        .stat-value { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }

        .footer { margin-top: 30px; font-weight: 700; color: #22c55e; letter-spacing: 1px; text-align: center; }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Estimasi Tubuh Tanpa Alat</h1>
        <p class="subtitle">Gunakan foto rentang tangan (wingspan) untuk memperkirakan tinggi & berat badan</p>
    </div>

    <div class="card">
        <div class="card-header">Upload & Pengukuran Rentang Tangan</div>
        
        <label class="file-upload-box" id="drop-zone">
            <span class="upload-text" id="upload-label">📷 Klik untuk upload foto rentang tangan</span>
            <input type="file" id="photo-input" accept="image/*" onchange="previewImage(event)">
        </label>

        <div id="preview-container">
            <img id="preview-img" src="" alt="Preview Foto">
        </div>

        <div class="input-group">
            <label>Estimasi Panjang Rentang Tangan / Wingspan (cm)</label>
            <input type="number" id="wingspan" placeholder="Contoh: 170 (Ukur pakai tali/penggaris)">
        </div>

        <div class="input-group">
            <label>Jenis Kelamin (Untuk rumus berat ideal)</label>
            <select id="gender">
                <option value="" disabled selected>Pilih jenis kelamin...</option>
                <option value="male">Pria</option>
                <option value="female">Wanita</option>
            </select>
        </div>

        <button onclick="calculateEstimation()">Estimasi Tinggi & Berat</button>
    </div>

    <div id="result-container">
        <div class="card result-box">
            <div class="card-header" style="margin-bottom: 15px;">Hasil Estimasi Anatomi</div>
            
            <div class="stat-row">
                <div class="stat-label">Estimasi Tinggi Badan</div>
                <div class="stat-value" id="res-height">0 cm</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Perkiraan Berat Ideal (Broca)</div>
                <div class="stat-value" id="res-weight" style="color: #f87171;">0 kg</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Status BMI Estimasi</div>
                <div class="stat-value" id="res-bmi" style="color: #22c55e;">Normal</div>
            </div>
        </div>
    </div>

    <div class="footer">Created by_aggx</div>

    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                    document.getElementById('upload-label').innerText = "Ganti Foto Rentang Tangan";
                }
                reader.readAsDataURL(file);
            }
        }

        function calculateEstimation() {
            const wingspan = parseFloat(document.getElementById('wingspan').value);
            const gender = document.getElementById('gender').value;

            if (!wingspan || wingspan <= 0) {
                alert("Harap masukkan angka panjang rentang tangan (wingspan) terlebih dahulu!");
                return;
            }
            if (!gender) {
                alert("Pilih jenis kelamin terlebih dahulu!");
                return;
            }

            // 1. Tinggi badan diasumsikan setara dengan rentang tangan (Wingspan $\approx$ Height)
            const estimatedHeight = wingspan;

            // 2. Hitung Berat Badan Ideal menggunakan rumus Broca
            let idealWeight = 0;
            if (gender === 'male') {
                idealWeight = (estimatedHeight - 100) - ((estimatedHeight - 100) * 0.1);
            } else {
                idealWeight = (estimatedHeight - 100) - ((estimatedHeight - 100) * 0.15);
            }

            // 3. Hitung BMI berdasarkan tinggi dan berat ideal perkiraan
            const heightM = estimatedHeight / 100;
            const bmi = idealWeight / (heightM * heightM);

            let bmiStatus = "Normal (Ideal)";
            if (bmi < 18.5) bmiStatus = "Kurus (Underweight)";
            else if (bmi > 24.9) bmiStatus = "Kelebihan Berat Badan";

            // Tampilkan hasil ke UI
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('res-height').innerText = estimatedHeight.toFixed(0) + " cm";
            document.getElementById('res-weight').innerText = idealWeight.toFixed(1) + " kg";
            document.getElementById('res-bmi').innerText = bmiStatus;
        }
    </script>
</body>
</html>
