<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator Pengukur Ruangan AI Profesional</title>
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        .calc-container {
            width: 100vw;
            height: 100vh;
            background: #181818;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .calc-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(24, 24, 24, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .back-icon {
            font-size: 1.2rem;
            color: #e0e0e0;
            cursor: pointer;
            margin-right: 15px;
        }

        .calc-title {
            font-size: 1rem;
            font-weight: 500;
            color: #e0e0e0;
            flex-grow: 1;
        }

        .unit-dropdown-btn {
            background: transparent;
            border: none;
            color: #ffcc00;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Tampilan Panel Hasil & Kontrol Bawah */
        .bottom-ui-panel {
            display: none;
            flex-direction: column;
            background: #181818;
            z-index: 10;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
        }

        .calc-display {
            padding: 10px 20px;
            text-align: right;
            background: transparent;
        }

        .result-value-display {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 400;
            margin-top: 2px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #2c2c2e;
        }

        .action-btn {
            background: #1e1e1e;
            border: none;
            color: #ffcc00;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn input {
            display: none;
        }

        /* Workspace Full Layar */
        .workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: block;
            overflow: hidden;
            touch-action: none;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Tombol Ambil Foto Melayang di Atas Kamera */
        .capture-live-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff453a;
            color: white;
            border: none;
            border-radius: 30px;
            width: 80px;
            height: 80px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255,69,58,0.5);
            z-index: 20;
        }

        /* Tombol Alternatif Pilih File saat awal */
        .upload-initial-btn {
            position: absolute;
            bottom: 40px;
            left: 20px;
            background: #2c2c2e;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-initial-btn input { display: none; }

        .ai-status-banner {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(48, 209, 88, 0.85);
            color: #fff;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 20px;
            text-align: center;
            z-index: 30;
            display: none;
        }

        .control-panel {
            padding: 10px 16px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #8e8e93;
        }

        .control-row input[type="number"] {
            background: #2c2c2e;
            border: none;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            width: 80px;
            text-align: right;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: #2c2c2e;
            color: #ffcc00;
            border: 1px solid #3a3a3c;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .btn-tool.active {
            background: #ffcc00;
            color: #121212;
            border-color: #ffcc00;
        }

        .btn-clear {
            background: #ff453a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 500;
        }

        .unit-popup {
            position: absolute;
            top: 55px;
            right: 15px;
            width: 200px;
            background: #2c2c2e;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 6px 0;
        }

        .unit-item {
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-item:hover { background: #3a3a3c; }
        .unit-item.active { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="calc-header">
            <span class="back-icon" onclick="resetToCamera()">↺</span>
            <span class="calc-title">Pengukur Ruangan AI</span>
            <button class="unit-dropdown-btn" onclick="toggleUnitMenu()">
                <span id="currentUnitLabel">cm</span> ▾
            </button>
        </div>

        <div class="unit-popup" id="unitPopup">
            <div class="unit-item active" onclick="selectUnit('cm', 'cm')">Sentimeter <span>cm</span></div>
            <div class="unit-item" onclick="selectUnit('m', 'm')">Meter <span>m</span></div>
            <div class="unit-item" onclick="selectUnit('mm', 'mm')">Milimeter <span>mm</span></div>
            <div class="unit-item" onclick="selectUnit('in', 'in')">Inci <span>in</span></div>
        </div>

        <div class="ai-status-banner" id="aiBanner">⚡ Memuat Model AI...</div>

        <!-- Workspace Full Layar -->
        <div class="workspace" id="workspace">
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="measCanvas"></canvas>
        </div>

        <!-- Tombol Awal (Full Camera View) -->
        <button class="capture-live-btn" id="captureBtn" onclick="captureLiveFrame()">📷</button>
        <label class="upload-initial-btn" id="uploadInitialBtn">
            📁 Galeri
            <input type="file" accept="image/*" onchange="handleMedia(event)">
        </label>

        <!-- Panel Perhitungan & Kontrol Bawah (Muncul SETELAH foto ada) -->
        <div class="bottom-ui-panel" id="bottomUiPanel">
            <div class="calc-display">
                <div style="font-size: 0.7rem; color: #8e8e93;">Total Panjang Garis:</div>
                <div class="result-value-display" id="resultDisplay">0 cm</div>
            </div>

            <div class="action-grid">
                <button class="action-btn" onclick="resetToCamera()">📷 Buka Kamera Lagi</button>
                <label class="action-btn">
                    📁 Ganti Foto
                    <input type="file" accept="image/*" onchange="handleMedia(event)">
                </label>
            </div>

            <div class="control-panel">
                <div class="control-row">
                    <span>Skala (cm/100px):</span>
                    <input type="number" id="scaleFactor" value="10" oninput="redrawCanvas()">
                </div>
                
                <div class="btn-group">
                    <button class="btn-tool active" id="btnModeDraw" onclick="setMode('draw')">✏️ Buat Titik</button>
                    <button class="btn-tool" id="btnModeSplit" onclick="setMode('split')">➕ Sisip Titik</button>
                </div>

                <div class="control-row">
                    <button class="btn-tool" onclick="addNewLineSegment()" style="background:#2c2c2e; color:#ffcc00; border:1px solid #ffcc00;">➕ Tambah Garis Baru</button>
                    <button class="btn-clear" onclick="clearPoints()">🗑️ Hapus Semua</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let aiModel = null;
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('measCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isImageLoaded = false;
        let isLiveCamera = true;
        
        let lines = [[]]; 
        let currentLineIndex = 0;
        let interactionMode = 'draw'; 
        let currentUnitKey = 'cm';

        window.addEventListener('DOMContentLoaded', () => {
            startLiveCamera();
        });

        cocoSsd.load({ base: 'lite_mobilenet_v2' }).then(model => {
            aiModel = model;
            const banner = document.getElementById('aiBanner');
            banner.style.display = 'block';
            banner.innerText = "⚡ AI Cepat Siap!";
            setTimeout(() => banner.style.display = 'none', 2000);
        }).catch(err => console.log(err));

        function toggleUnitMenu() {
            const popup = document.getElementById('unitPopup');
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function selectUnit(key, label) {
            currentUnitKey = key;
            document.getElementById('currentUnitLabel').innerText = label;
            document.getElementById('unitPopup').style.display = 'none';
            document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            redrawCanvas();
        }

        function setMode(mode) {
            interactionMode = mode;
            document.getElementById('btnModeDraw').classList.toggle('active', mode === 'draw');
            document.getElementById('btnModeSplit').classList.toggle('active', mode === 'split');
        }

        async function startLiveCamera() {
            isLiveCamera = true;
            isImageLoaded = false;
            lines = [[]];
            currentLineIndex = 0;

            document.getElementById('bottomUiPanel').style.display = 'none';
            document.getElementById('captureBtn').style.display = 'flex';
            document.getElementById('uploadInitialBtn').style.display = 'flex';
            canvas.style.display = 'none';
            video.style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => { video.play(); };
            } catch (err) {
                console.log("Kamera dibatasi/izin ditolak.");
            }
        }

        function resetToCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            startLiveCamera();
        }

        function captureLiveFrame() {
            const w = video.videoWidth || window.innerWidth;
            const h = video.videoHeight || window.innerHeight;
            canvas.width = w;
            canvas.height = h;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            img.onload = function() {
                isImageLoaded = true;
                isLiveCamera = false;
                
                video.style.display = 'none';
                canvas.style.display = 'block';
                document.getElementById('captureBtn').style.display = 'none';
                document.getElementById('uploadInitialBtn').style.display = 'none';
                document.getElementById('bottomUiPanel').style.display = 'flex';
                
                redrawCanvas();
                runSuperFastAiDetection();
            };
            img.src = canvas.toDataURL('image/png');
        }

        function handleMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    isImageLoaded = true;
                    isLiveCamera = false;

                    video.style.display = 'none';
                    canvas.style.display = 'block';
                    document.getElementById('captureBtn').style.display = 'none';
                    document.getElementById('uploadInitialBtn').style.display = 'none';
                    document.getElementById('bottomUiPanel').style.display = 'flex';

                    redrawCanvas();
                    runSuperFastAiDetection();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function runSuperFastAiDetection() {
            const banner = document.getElementById('aiBanner');
            banner.style.display = 'block';
            banner.innerText = "⚡ AI memindai secara kilat...";
            
            if (!aiModel) {
                banner.style.display = 'none';
                return;
            }

            try {
                const predictions = await aiModel.detect(canvas);
                const standardSizes = { 'cell phone': 7.5, 'laptop': 32.0, 'book': 15.0, 'bottle': 7.0, 'cup': 8.0, 'mouse': 10.0 };
                
                let found = false;
                for (let p of predictions) {
                    if (standardSizes[p.class]) {
                        const calculatedScale = (standardSizes[p.class] / p.bbox[2]) * 100;
                        document.getElementById('scaleFactor').value = calculatedScale.toFixed(2);
                        banner.innerText = `✨ Ketemu (${p.class})! Skala dikalibrasi.`;
                        found = true;
                        redrawCanvas();
                        break;
                    }
                }

                if (!found) {
                    banner.innerText = "⚡ Pemindaian selesai.";
                }
                setTimeout(() => { banner.style.display = 'none'; }, 2500);
            } catch (err) {
                banner.style.display = 'none';
            }
        }

        function addNewLineSegment() {
            if (!lines) lines = [];
            lines.push([]);
            currentLineIndex = lines.length - 1;
            setMode('draw');
            redrawCanvas();
        }

        function clearPoints() {
            lines = [[]];
            currentLineIndex = 0;
            redrawCanvas();
        }

        function formatVal(pxDist) {
            const scaleFactor = parseFloat(document.getElementById('scaleFactor').value) || 10;
            let valCm = (pxDist / 100) * scaleFactor;
            
            if (currentUnitKey === 'm') valCm /= 100;
            if (currentUnitKey === 'mm') valCm *= 10;
            if (currentUnitKey === 'in') valCm /= 2.54;

            return valCm.toFixed(1) + ' ' + currentUnitKey;
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isImageLoaded && img.src) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }

            let totalPxAll = 0;

            if (lines && Array.isArray(lines)) {
                for (let l = 0; l < lines.length; l++) {
                    let pts = lines[l];
                    if (pts && Array.isArray(pts) && pts.length > 0) {
                        for (let i = 0; i < pts.length - 1; i++) {
                            const p1 = pts[i];
                            const p2 = pts[i+1];

                            if (p1 && p2) {
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = (l === currentLineIndex) ? '#ffcc00' : '#ff9500';
                                ctx.lineWidth = 4;
                                ctx.stroke();

                                const dx = p2.x - p1.x;
                                const dy = p2.y - p1.y;
                                const distPx = Math.sqrt(dx*dx + dy*dy);
                                totalPxAll += distPx;

                                const midX = (p1.x + p2.x) / 2;
                                const midY = (p1.y + p2.y) / 2;
                                
                                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                                ctx.fillRect(midX - 32, midY - 14, 64, 28);

                                ctx.fillStyle = '#ffcc00';
                                ctx.font = 'bold 12px Roboto';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(formatVal(distPx), midX, midY);
                            }
                        }

                        for (let i = 0; i < pts.length; i++) {
                            if (pts[i]) {
                                ctx.fillStyle = (l === currentLineIndex) ? '#ffcc00' : '#ff9500';
                                ctx.beginPath(); 
                                ctx.arc(pts[i].x, pts[i].y, 7, 0, Math.PI * 2); 
                                ctx.fill();
                                ctx.strokeStyle = '#000000';
                                ctx.lineWidth = 2;
                                ctx.stroke();
                            }
                        }
                    }
                }
            }

            const resultEl = document.getElementById('resultDisplay');
            if (resultEl) resultEl.innerText = formatVal(totalPxAll);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const renderWidth = rect.width;
            const renderHeight = rect.height;
            
            const imgRatio = canvas.width / canvas.height;
            const displayRatio = renderWidth / renderHeight;
            
            let scale, offsetX = 0, offsetY = 0;
            
            if (displayRatio > imgRatio) {
                scale = renderHeight / canvas.height;
                offsetX = (renderWidth - canvas.width * scale) / 2;
            } else {
                scale = renderWidth / canvas.width;
                offsetY = (renderHeight - canvas.height * scale) / 2;
            }
            
            const clickX = (clientX - rect.left - offsetX) / scale;
            const clickY = (clientY - rect.top - offsetY) / scale;
            
            return { x: clickX, y: clickY };
        }

        function handleCanvasClick(e) {
            if (isLiveCamera || !isImageLoaded) return;
            const pos = getMousePos(e);

            if (pos.x < 0 || pos.y < 0 || pos.x > canvas.width || pos.y > canvas.height) return;

            if (interactionMode === 'draw') {
                if (!lines[currentLineIndex]) {
                    lines[currentLineIndex] = [];
                }
                lines[currentLineIndex].push(pos);
                redrawCanvas();
            } else if (interactionMode === 'split') {
                let inserted = false;
                for (let l = 0; l < lines.length; l++) {
                    let pts = lines[l];
                    if (pts) {
                        for (let i = 0; i < pts.length - 1; i++) {
                            let p1 = pts[i];
                            let p2 = pts[i+1];
                            
                            let dist = distToSegment(pos, p1, p2);
                            if (dist < 35) { 
                                pts.splice(i + 1, 0, pos);
                                inserted = true;
                                break;
                            }
                        }
                    }
                    if (inserted) break;
                }
                if (inserted) {
                    redrawCanvas();
                    setMode('draw'); 
                } else {
                    alert("Ketuk lebih dekat ke garis kuning.");
                }
            }
        }

        function distToSegment(p, p1, p2) {
            let l2 = (p2.x - p1.x)*(p2.x - p1.x) + (p2.y - p1.y)*(p2.y - p1.y);
            if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y);
            let t = ((p.x - p1.x)*(p2.x - p1.x) + (p.y - p1.y)*(p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
        }

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchend', (e) => {
            if (isLiveCamera) return;
            e.preventDefault();
        }, { passive: false });

        window.onclick = function(event) {
            if (!event.target.closest('.unit-dropdown-btn') && !event.target.closest('.unit-popup')) {
                document.getElementById('unitPopup').style.display = 'none';
            }
        }
    </script>
</body>
</html>
