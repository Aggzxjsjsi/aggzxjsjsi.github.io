<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pengukur Ruangan AI</title>
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .calc-container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .calc-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #181818;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-icon {
            font-size: 1.2rem;
            color: #e0e0e0;
            cursor: pointer;
            margin-right: 15px;
        }

        .calc-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0e0e0;
            flex-grow: 1;
        }

        .unit-dropdown-btn {
            background: transparent;
            border: none;
            color: #ffcc00;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .calc-display {
            padding: 20px;
            text-align: right;
            background: #181818;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .result-value-display {
            font-size: 2rem;
            color: #ffffff;
            font-weight: 400;
            margin-top: 5px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #2c2c2e;
        }

        .action-btn {
            background: #1e1e1e;
            border: none;
            color: #ffcc00;
            padding: 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn input {
            display: none;
        }

        .workspace {
            position: relative;
            background: #000;
            width: 100%;
            height: 280px;
            display: none;
            overflow: hidden;
            border-top: 1px solid #2c2c2e;
            border-bottom: 1px solid #2c2c2e;
            touch-action: none;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .capture-live-btn {
            background: #ff453a;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        .ai-status-banner {
            background: rgba(48, 209, 88, 0.15);
            color: #30d158;
            font-size: 0.75rem;
            padding: 8px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(48, 209, 88, 0.3);
            display: none;
        }

        .control-panel {
            padding: 15px 20px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #8e8e93;
        }

        .control-row input[type="number"] {
            background: #2c2c2e;
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 90px;
            text-align: right;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-clear {
            background: #ff453a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }

        .unit-popup {
            position: absolute;
            top: 60px;
            left: 15px;
            width: 240px;
            max-height: 350px;
            background: #2c2c2e;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 8px 0;
        }

        .unit-item {
            padding: 12px 20px;
            font-size: 0.9rem;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-item:hover { background: #3a3a3c; }
        .unit-item.active { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="calc-header">
            <span class="back-icon">←</span>
            <span class="calc-title">Pengukur Ruangan</span>
            <button class="unit-dropdown-btn" onclick="toggleUnitMenu()">
                <span id="currentUnitLabel">cm</span> ▾
            </button>
        </div>

        <div class="unit-popup" id="unitPopup">
            <div class="unit-item active" onclick="selectUnit('cm', 'cm')">Sentimeter <span>cm</span></div>
            <div class="unit-item" onclick="selectUnit('m', 'm')">Meter <span>m</span></div>
            <div class="unit-item" onclick="selectUnit('mm', 'mm')">Milimeter <span>mm</span></div>
            <div class="unit-item" onclick="selectUnit('in', 'in')">Inci <span>in</span></div>
        </div>

        <div class="calc-display">
            <div style="font-size: 0.8rem; color: #8e8e93;">Total Panjang Garis:</div>
            <div class="result-value-display" id="resultDisplay">0 cm</div>
        </div>

        <div class="action-grid">
            <button class="action-btn" onclick="startLiveCamera()">📷 Buka Kamera</button>
            <label class="action-btn">
                📁 Pilih Foto
                <input type="file" accept="image/*" onchange="handleMedia(event)">
            </label>
        </div>

        <div class="ai-status-banner" id="aiBanner">🤖 Memuat AI...</div>

        <div class="workspace" id="workspace">
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="measCanvas"></canvas>
        </div>
        <button class="capture-live-btn" id="captureBtn" onclick="captureLiveFrame()">📸 Ambil Foto Sekarang</button>

        <div class="control-panel">
            <div class="control-row">
                <span>Skala (cm/100px):</span>
                <input type="number" id="scaleFactor" value="10" oninput="redrawCanvas()">
            </div>
            <div class="control-row">
                <button class="btn-clear" onclick="clearPoints()">🗑️ Hapus Semua Garis</button>
                <div style="font-size: 0.65rem; color: #8e8e93; text-align: right;">
                    Ketuk layar untuk buat titik sambung
                </div>
            </div>
        </div>
    </div>

    <script>
        let aiModel = null;
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('measCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isLiveCamera = false;
        let points = []; 
        let currentUnitKey = 'cm';

        cocoSsd.load().then(model => {
            aiModel = model;
        }).catch(err => console.log(err));

        function toggleUnitMenu() {
            const popup = document.getElementById('unitPopup');
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function selectUnit(key, label) {
            currentUnitKey = key;
            document.getElementById('currentUnitLabel').innerText = label;
            document.getElementById('unitPopup').style.display = 'none';
            document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            redrawCanvas();
        }

        async function startLiveCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                await video.play();
                
                video.style.display = 'block';
                canvas.style.display = 'none';
                document.getElementById('workspace').style.display = 'block';
                document.getElementById('captureBtn').style.display = 'block';
                document.getElementById('aiBanner').style.display = 'none';
                isLiveCamera = true;
            } catch (err) {
                alert("Kamera tidak dapat diakses. Pastikan izin kamera aktif.");
            }
        }

        function captureLiveFrame() {
            if (!isLiveCamera) return;
            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;
            canvas.width = w;
            canvas.height = h;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            video.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'none';
            isLiveCamera = false;
            
            // Simpan gambar background statis
            img.src = canvas.toDataURL();
            redrawCanvas();
            runAiDetection();
        }

        function handleMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    video.style.display = 'none';
                    canvas.style.display = 'block';
                    document.getElementById('workspace').style.display = 'block';
                    document.getElementById('captureBtn').style.display = 'none';
                    isLiveCamera = false;
                    redrawCanvas();
                    runAiDetection();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function runAiDetection() {
            const banner = document.getElementById('aiBanner');
            banner.style.display = 'block';
            banner.innerText = "🤖 AI memindai referensi ukuran...";
            if (!aiModel) return;

            try {
                const predictions = await aiModel.detect(canvas);
                const standardSizes = { 'cell phone': 7.5, 'laptop': 32.0, 'book': 15.0, 'bottle': 7.0 };
                for (let p of predictions) {
                    if (standardSizes[p.class]) {
                        const calculatedScale = (standardSizes[p.class] / p.bbox[2]) * 100;
                        document.getElementById('scaleFactor').value = calculatedScale.toFixed(2);
                        banner.innerText = `✨ Terdeteksi ${p.class}! Skala disesuaikan.`;
                        redrawCanvas();
                        break;
                    }
                }
            } catch (err) {
                banner.style.display = 'none';
            }
        }

        function clearPoints() {
            points = [];
            redrawCanvas();
        }

        function formatVal(pxDist) {
            const scaleFactor = parseFloat(document.getElementById('scaleFactor').value) || 10;
            let valCm = (pxDist / 100) * scaleFactor;
            
            if (currentUnitKey === 'm') valCm /= 100;
            if (currentUnitKey === 'mm') valCm *= 10;
            if (currentUnitKey === 'in') valCm /= 2.54;

            return valCm.toFixed(1) + ' ' + currentUnitKey;
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!isLiveCamera && img.src) {
                ctx.drawImage(img, 0, 0);
            }

            let totalDist = 0;

            if (points.length > 0) {
                // Gambar garis antar titik dan label ukuran di setiap ruas garis
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i+1];

                    // Garis Kuning Terang (seperti contoh gambar)
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = '#ffcc00';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Hitung panjang ruas ini
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distPx = Math.sqrt(dx*dx + dy*dy);
                    totalDist += distPx;

                    // Tulis teks ukuran di tengah garis
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(midX - 25, midY - 12, 50, 24);

                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 12px Roboto';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(formatVal(distPx), midX, midY);
                }

                // Gambar Titik Kuning di setiap sudut
                for (let i = 0; i < points.length; i++) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath(); 
                    ctx.arc(points[i].x, points[i].y, 5, 0, Math.PI * 2); 
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            // Update total di layar atas
            let totalPxAll = 0;
            for (let i = 0; i < points.length - 1; i++) {
                const dx = points[i+1].x - points[i].x;
                const dy = points[i+1].y - points[i].y;
                totalPxAll += Math.sqrt(dx*dx + dy*dy);
            }
            document.getElementById('resultDisplay').innerText = formatVal(totalPxAll);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('click', (e) => {
            if (isLiveCamera) return;
            const pos = getMousePos(e);
            points.push(pos);
            redrawCanvas();
        });

        canvas.addEventListener('touchend', (e) => {
            if (isLiveCamera) return;
            e.preventDefault();
        }, { passive: false });

        window.onclick = function(event) {
            if (!event.target.closest('.unit-dropdown-btn') && !event.target.closest('.unit-popup')) {
                document.getElementById('unitPopup').style.display = 'none';
            }
        }
    </script>
</body>
</html>
