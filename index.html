<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pengukur Ruangan AI Profesional</title>
    <!-- TensorFlow.js & COCO-SSD Model (Lite version untuk kecepatan maksimal) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .calc-container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .calc-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #181818;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-icon {
            font-size: 1.2rem;
            color: #e0e0e0;
            cursor: pointer;
            margin-right: 15px;
        }

        .calc-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0e0e0;
            flex-grow: 1;
        }

        .unit-dropdown-btn {
            background: transparent;
            border: none;
            color: #ffcc00;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .calc-display {
            padding: 20px;
            text-align: right;
            background: #181818;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .result-value-display {
            font-size: 2rem;
            color: #ffffff;
            font-weight: 400;
            margin-top: 5px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #2c2c2e;
        }

        .action-btn {
            background: #1e1e1e;
            border: none;
            color: #ffcc00;
            padding: 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn input {
            display: none;
        }

        .workspace {
            position: relative;
            background: #000;
            width: 100%;
            height: 380px;
            display: none;
            overflow: hidden;
            border-top: 1px solid #2c2c2e;
            border-bottom: 1px solid #2c2c2e;
            touch-action: none;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .capture-live-btn {
            background: #ff453a;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        .ai-status-banner {
            background: rgba(48, 209, 88, 0.15);
            color: #30d158;
            font-size: 0.75rem;
            padding: 8px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(48, 209, 88, 0.3);
            display: none;
        }

        .control-panel {
            padding: 15px 20px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #8e8e93;
        }

        .control-row input[type="number"] {
            background: #2c2c2e;
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 90px;
            text-align: right;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: #2c2c2e;
            color: #ffcc00;
            border: 1px solid #3a3a3c;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .btn-tool.active {
            background: #ffcc00;
            color: #121212;
            border-color: #ffcc00;
        }

        .btn-clear {
            background: #ff453a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }

        .unit-popup {
            position: absolute;
            top: 60px;
            left: 15px;
            width: 240px;
            max-height: 350px;
            background: #2c2c2e;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 8px 0;
        }

        .unit-item {
            padding: 12px 20px;
            font-size: 0.9rem;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-item:hover { background: #3a3a3c; }
        .unit-item.active { color: #ffcc00; }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="calc-header">
            <span class="back-icon">←</span>
            <span class="calc-title">Pengukur Ruangan AI</span>
            <button class="unit-dropdown-btn" onclick="toggleUnitMenu()">
                <span id="currentUnitLabel">cm</span> ▾
            </button>
        </div>

        <div class="unit-popup" id="unitPopup">
            <div class="unit-item active" onclick="selectUnit('cm', 'cm')">Sentimeter <span>cm</span></div>
            <div class="unit-item" onclick="selectUnit('m', 'm')">Meter <span>m</span></div>
            <div class="unit-item" onclick="selectUnit('mm', 'mm')">Milimeter <span>mm</span></div>
            <div class="unit-item" onclick="selectUnit('in', 'in')">Inci <span>in</span></div>
        </div>

        <div class="calc-display">
            <div style="font-size: 0.8rem; color: #8e8e93;">Total Panjang Garis:</div>
            <div class="result-value-display" id="resultDisplay">0 cm</div>
        </div>

        <div class="action-grid">
            <button class="action-btn" onclick="startLiveCamera()">📷 Buka Kamera</button>
            <label class="action-btn">
                📁 Pilih Foto
                <input type="file" accept="image/*" onchange="handleMedia(event)">
            </label>
        </div>

        <div class="ai-status-banner" id="aiBanner">⚡ Memuat Model Cepat...</div>

        <div class="workspace" id="workspace">
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="measCanvas"></canvas>
        </div>
        <button class="capture-live-btn" id="captureBtn" onclick="captureLiveFrame()">📸 Ambil Foto Sekarang</button>

        <div class="control-panel">
            <div class="control-row">
                <span>Skala (cm/100px):</span>
                <input type="number" id="scaleFactor" value="10" oninput="redrawCanvas()">
            </div>
            
            <div class="btn-group">
                <button class="btn-tool active" id="btnModeDraw" onclick="setMode('draw')">✏️ Buat Titik/Garis</button>
                <button class="btn-tool" id="btnModeSplit" onclick="setMode('split')">➕ Sisip Titik di Garis</button>
            </div>

            <div class="control-row">
                <button class="btn-tool" onclick="addNewLineSegment()" style="background:#2c2c2e; color:#ffcc00; border:1px solid #ffcc00;">➕ Tambah Garis Baru</button>
                <button class="btn-clear" onclick="clearPoints()">🗑️ Hapus Semua</button>
            </div>
            <div style="font-size: 0.65rem; color: #8e8e93; text-align: center;" id="helperText">
                Ketuk layar untuk membuat titik dan garis bersambung.
            </div>
        </div>
    </div>

    <script>
        let aiModel = null;
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('measCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isLiveCamera = false;
        
        // Struktur data garis: Berisi array of array (bisa banyak garis/segmen terpisah)
        let lines = [[]]; 
        let currentLineIndex = 0;
        let interactionMode = 'draw'; // 'draw' atau 'split'
        let currentUnitKey = 'cm';

        cocoSsd.load({ base: 'lite_mobilenet_v2' }).then(model => {
            aiModel = model;
            const banner = document.getElementById('aiBanner');
            banner.style.display = 'block';
            banner.innerText = "⚡ AI Cepat Siap!";
            setTimeout(() => banner.style.display = 'none', 2000);
        }).catch(err => console.log(err));

        function toggleUnitMenu() {
            const popup = document.getElementById('unitPopup');
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function selectUnit(key, label) {
            currentUnitKey = key;
            document.getElementById('currentUnitLabel').innerText = label;
            document.getElementById('unitPopup').style.display = 'none';
            document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            redrawCanvas();
        }

        function setMode(mode) {
            interactionMode = mode;
            document.getElementById('btnModeDraw').classList.toggle('active', mode === 'draw');
            document.getElementById('btnModeSplit').classList.toggle('active', mode === 'split');
            
            const helper = document.getElementById('helperText');
            if(mode === 'draw') {
                helper.innerText = "Ketuk layar untuk menambah titik pada garis aktif.";
            } else {
                helper.innerText = "Ketuk tepat di atas garis kuning untuk menyisipkan titik baru di tengahnya.";
            }
        }

        async function startLiveCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => { video.play(); };
                
                video.style.display = 'block';
                canvas.style.display = 'none';
                document.getElementById('workspace').style.display = 'block';
                document.getElementById('captureBtn').style.display = 'block';
                document.getElementById('aiBanner').style.display = 'none';
                isLiveCamera = true;
            } catch (err) {
                alert("Kamera tidak dapat diakses. Pastikan izin kamera aktif.");
            }
        }

        function captureLiveFrame() {
            if (!isLiveCamera) return;
            const w = video.videoWidth || 1280;
            const h = video.videoHeight || 720;
            canvas.width = w;
            canvas.height = h;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            // Ubah data video ke objek gambar statis agar tidak hitam
            img.src = canvas.toDataURL('image/png');

            video.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'none';
            isLiveCamera = false;
            
            redrawCanvas();
            runSuperFastAiDetection();
        }

        function handleMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    video.style.display = 'none';
                    canvas.style.display = 'block';
                    document.getElementById('workspace').style.display = 'block';
                    document.getElementById('captureBtn').style.display = 'none';
                    isLiveCamera = false;
                    redrawCanvas();
                    runSuperFastAiDetection();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function runSuperFastAiDetection() {
            const banner = document.getElementById('aiBanner');
            banner.style.display = 'block';
            banner.innerText = "⚡ AI memindai secara kilat...";
            
            if (!aiModel) {
                banner.style.display = 'none';
                return;
            }

            try {
                const predictions = await aiModel.detect(canvas);
                const standardSizes = { 'cell phone': 7.5, 'laptop': 32.0, 'book': 15.0, 'bottle': 7.0, 'cup': 8.0, 'mouse': 10.0 };
                
                let found = false;
                for (let p of predictions) {
                    if (standardSizes[p.class]) {
                        const calculatedScale = (standardSizes[p.class] / p.bbox[2]) * 100;
                        document.getElementById('scaleFactor').value = calculatedScale.toFixed(2);
                        banner.innerText = `✨ Ketemu (${p.class})! Skala dikalibrasi instan.`;
                        found = true;
                        redrawCanvas();
                        break;
                    }
                }

                if (!found) {
                    banner.innerText = "⚡ Pemindaian selesai.";
                }
                setTimeout(() => { banner.style.display = 'none'; }, 3000);
            } catch (err) {
                banner.style.display = 'none';
            }
        }

        function addNewLineSegment() {
            lines.push([]);
            currentLineIndex = lines.length - 1;
            setMode('draw');
            redrawCanvas();
        }

        function clearPoints() {
            lines = [[]];
            currentLineIndex = 0;
            redrawCanvas();
        }

        function formatVal(pxDist) {
            const scaleFactor = parseFloat(document.getElementById('scaleFactor').value) || 10;
            let valCm = (pxDist / 100) * scaleFactor;
            
            if (currentUnitKey === 'm') valCm /= 100;
            if (currentUnitKey === 'mm') valCm *= 10;
            if (currentUnitKey === 'in') valCm /= 2.54;

            return valCm.toFixed(1) + ' ' + currentUnitKey;
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Gambar ulang foto latar belakang secara permanen
            if (img.src) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }

            let totalPxAll = 0;

            // Loop semua garis/segmen
            for (let l = 0; l < lines.length; l++) {
                let pts = lines[l];
                if (pts.length > 0) {
                    for (let i = 0; i < pts.length - 1; i++) {
                        const p1 = pts[i];
                        const p2 = pts[i+1];

                        // Garis Kuning
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = (l === currentLineIndex) ? '#ffcc00' : '#ff9500';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const distPx = Math.sqrt(dx*dx + dy*dy);
                        totalPxAll += distPx;

                        // Label Teks Ukuran di tengah ruas garis
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                        ctx.fillRect(midX - 28, midY - 12, 56, 24);

                        ctx.fillStyle = '#ffcc00';
                        ctx.font = 'bold 11px Roboto';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(formatVal(distPx), midX, midY);
                    }

                    // Gambar Titik Sudut
                    for (let i = 0; i < pts.length; i++) {
                        ctx.fillStyle = (l === currentLineIndex) ? '#ffcc00' : '#ff9500';
                        ctx.beginPath(); 
                        ctx.arc(pts[i].x, pts[i].y, 5, 0, Math.PI * 2); 
                        ctx.fill();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
            }

            document.getElementById('resultDisplay').innerText = formatVal(totalPxAll);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // Fungsi mengecek jarak titik ke garis (untuk menyisipkan titik di tengah garis)
        function handleCanvasClick(e) {
            if (isLiveCamera || !img.src) return;
            const pos = getMousePos(e);

            if (interactionMode === 'draw') {
                if (!lines[currentLineIndex]) lines[currentLineIndex] = [];
                lines[currentLineIndex].push(pos);
                redrawCanvas();
            } else if (interactionMode === 'split') {
                // Cari ruas garis terdekat untuk disisipkan titik baru di tengahnya
                let inserted = false;
                for (let l = 0; l < lines.length; l++) {
                    let pts = lines[l];
                    for (let i = 0; i < pts.length - 1; i++) {
                        let p1 = pts[i];
                        let p2 = pts[i+1];
                        
                        // Hitung jarak klik ke segmen garis (p1 ke p2)
                        let dist = distToSegment(pos, p1, p2);
                        if (dist < 20) { // Toleransi klik 20 pixel
                            // Sisipkan titik di antara i dan i+1
                            pts.splice(i + 1, 0, pos);
                            inserted = true;
                            break;
                        }
                    }
                    if (inserted) break;
                }
                if (inserted) {
                    redrawCanvas();
                    setMode('draw'); // Kembali otomatis ke mode gambar setelah titik disisipkan
                } else {
                    alert("Ketuk lebih dekat ke garis kuning untuk menyisipkan titik.");
                }
            }
        }

        // Rumus matematika jarak titik ke garis segmen
        function distToSegment(p, p1, p2) {
            let l2 = (p2.x - p1.x)*(p2.x - p1.x) + (p2.y - p1.y)*(p2.y - p1.y);
            if (l2 ===.0) return Math.hypot(p.x - p1.x, p.y - p1.y);
            let t = ((p.x - p1.x)*(p2.x - p1.x) + (p.y - p1.y)*(p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
        }

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchend', (e) => {
            if (isLiveCamera) return;
            e.preventDefault();
        }, { passive: false });

        window.onclick = function(event) {
            if (!event.target.closest('.unit-dropdown-btn') && !event.target.closest('.unit-popup')) {
                document.getElementById('unitPopup').style.display = 'none';
            }
        }
    </script>
</body>
</html>
