<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pengukur Panjang Multi-Titik AI</title>
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .calc-container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .calc-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #181818;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-icon {
            font-size: 1.2rem;
            color: #e0e0e0;
            cursor: pointer;
            margin-right: 15px;
        }

        .calc-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0e0e0;
            flex-grow: 1;
        }

        .unit-dropdown-btn {
            background: transparent;
            border: none;
            color: #ff9f0a;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .calc-display {
            padding: 20px;
            text-align: right;
            background: #181818;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .input-value-display {
            font-size: 1.5rem;
            color: #8e8e93;
            font-weight: 300;
        }

        .result-value-display {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 400;
            margin-top: 5px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #2c2c2e;
        }

        .action-btn {
            background: #1e1e1e;
            border: none;
            color: #ff9f0a;
            padding: 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:active {
            background: #2c2c2e;
        }

        .action-btn input {
            display: none;
        }

        .workspace {
            position: relative;
            background: #000;
            width: 100%;
            height: 250px;
            display: none;
            overflow: hidden;
            border-top: 1px solid #2c2c2e;
            border-bottom: 1px solid #2c2c2e;
            touch-action: none;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .capture-live-btn {
            background: #ff453a;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        .ai-status-banner {
            background: rgba(48, 209, 88, 0.15);
            color: #30d158;
            font-size: 0.75rem;
            padding: 8px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(48, 209, 88, 0.3);
            display: none;
        }

        .control-panel {
            padding: 15px 20px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #8e8e93;
        }

        .control-row input[type="number"] {
            background: #2c2c2e;
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 90px;
            text-align: right;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-clear {
            background: #ff453a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }

        .unit-popup {
            position: absolute;
            top: 60px;
            left: 15px;
            width: 240px;
            max-height: 350px;
            background: #2c2c2e;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 8px 0;
        }

        .unit-item {
            padding: 12px 20px;
            font-size: 0.9rem;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-item:hover { background: #3a3a3c; }
        .unit-item.active { color: #ff9f0a; }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="calc-header">
            <span class="back-icon">←</span>
            <span class="calc-title">Panjang AI Multi-Titik</span>
            <button class="unit-dropdown-btn" onclick="toggleUnitMenu()">
                <span id="currentUnitLabel">Sentimeter cm</span> ▾
            </button>
        </div>

        <div class="unit-popup" id="unitPopup">
            <div class="unit-item" onclick="selectUnit('km', 'Kilometer km')">Kilometer <span>km</span></div>
            <div class="unit-item active" onclick="selectUnit('cm', 'Sentimeter cm')">Sentimeter <span>cm</span></div>
            <div class="unit-item" onclick="selectUnit('m', 'Meter m')">Meter <span>m</span></div>
            <div class="unit-item" onclick="selectUnit('mm', 'Milimeter mm')">Milimeter <span>mm</span></div>
            <div class="unit-item" onclick="selectUnit('um', 'Mikrometer µm')">Mikrometer <span>µm</span></div>
            <div class="unit-item" onclick="selectUnit('nm', 'Nanometer nm')">Nanometer <span>nm</span></div>
            <div class="unit-item" onclick="selectUnit('mi', 'Mil mil')">Mil <span>mil</span></div>
            <div class="unit-item" onclick="selectUnit('yd', 'Yard yd')">Yard <span>yd</span></div>
            <div class="unit-item" onclick="selectUnit('ft', 'Kaki ft')">Kaki <span>ft</span></div>
            <div class="unit-item" onclick="selectUnit('in', 'Inci in')">Inci <span>in</span></div>
        </div>

        <div class="calc-display">
            <div class="input-value-display" id="pixelDisplay">0 px</div>
            <div class="result-value-display" id="resultDisplay">0</div>
        </div>

        <div class="action-grid">
            <button class="action-btn" onclick="startLiveCamera()">📷 Buka Kamera Live</button>
            <label class="action-btn">
                📁 Pilih Galeri
                <input type="file" accept="image/*,video/*" onchange="handleMedia(event)">
            </label>
        </div>

        <div class="ai-status-banner" id="aiBanner">🤖 AI sedang memuat model...</div>

        <div class="workspace" id="workspace">
            <!-- Atribut muted ditambahkan agar kamera live tidak hitam di HP -->
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="measCanvas"></canvas>
        </div>
        <button class="capture-live-btn" id="captureBtn" onclick="captureLiveFrame()">📸 Ambil Foto dari Kamera</button>

        <div class="control-panel">
            <div class="control-row">
                <span>Skala (cm/100px):</span>
                <input type="number" id="scaleFactor" value="5" oninput="calculateLength()">
            </div>
            <div class="control-row">
                <button class="btn-clear" onclick="clearPoints()">🗑️ Hapus Semua Titik</button>
                <div style="font-size: 0.65rem; color: #8e8e93; text-align: right;">
                    Ketuk layar berulang kali<br>untuk menambah banyak titik
                </div>
            </div>
        </div>
    </div>

    <script>
        let aiModel = null;
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('measCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isLiveCamera = false;
        let points = []; // Array untuk menyimpan banyak titik (multi-point path)
        let currentUnitKey = 'cm';

        // Load AI model
        cocoSsd.load().then(model => {
            aiModel = model;
            console.log("Model AI Berhasil Dimuat!");
        }).catch(err => {
            console.error("Gagal memuat AI:", err);
        });

        function toggleUnitMenu() {
            const popup = document.getElementById('unitPopup');
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function selectUnit(key, label) {
            currentUnitKey = key;
            document.getElementById('currentUnitLabel').innerText = label;
            document.getElementById('unitPopup').style.display = 'none';
            document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            calculateLength();
        }

        async function startLiveCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                await video.play();
                
                video.style.display = 'block';
                canvas.style.display = 'none';
                document.getElementById('workspace').style.display = 'block';
                document.getElementById('captureBtn').style.display = 'block';
                document.getElementById('aiBanner').style.display = 'none';
                isLiveCamera = true;
            } catch (err) {
                alert("Tidak dapat mengakses kamera. Pastikan menggunakan HTTPS atau Local Server.");
            }
        }

        function captureLiveFrame() {
            if (!isLiveCamera) return;
            
            const w = video.videoWidth || video.clientWidth || 640;
            const h = video.videoHeight || video.clientHeight || 480;
            canvas.width = w;
            canvas.height = h;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            video.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'none';
            isLiveCamera = false;
            
            redrawCanvas();
            runAiDetection();
        }

        function handleMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    video.style.display = 'none';
                    canvas.style.display = 'block';
                    document.getElementById('workspace').style.display = 'block';
                    document.getElementById('captureBtn').style.display = 'none';
                    isLiveCamera = false;
                    redrawCanvas();
                    runAiDetection();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function runAiDetection() {
            const banner = document.getElementById('aiBanner');
            banner.style.display = 'block';
            banner.innerText = "🤖 AI sedang memindai objek standar...";

            if (!aiModel) {
                banner.innerText = "⚠️ Model AI masih dimuat, gunakan skala manual.";
                return;
            }

            try {
                const predictions = await aiModel.detect(canvas);
                const standardSizes = {
                    'cell phone': 7.5, 
                    'laptop': 32.0,
                    'book': 15.0,
                    'keyboard': 44.0,
                    'bottle': 7.0,
                    'cup': 8.0,
                    'mouse': 10.0
                };

                let detected = false;
                for (let p of predictions) {
                    if (standardSizes[p.class]) {
                        const objWidthPx = p.bbox[2]; 
                        const realSizeCm = standardSizes[p.class];
                        
                        const calculatedScale = (realSizeCm / objWidthPx) * 100;
                        document.getElementById('scaleFactor').value = calculatedScale.toFixed(2);
                        
                        banner.innerText = `✨ AI Mendeteksi: "${p.class}"! Skala dikalibrasi otomatis.`;
                        detected = true;
                        calculateLength();
                        break;
                    }
                }

                if (!detected) {
                    banner.innerText = "ℹ️ Objek standar tak dikenali AI. Silakan sesuaikan skala manual.";
                }
            } catch (err) {
                banner.innerText = "⚠️ Gagal menjalankan AI pemindai.";
            }
        }

        function clearPoints() {
            points = [];
            document.getElementById('pixelDisplay').innerText = `0 px`;
            document.getElementById('resultDisplay').innerText = `0`;
            redrawCanvas();
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!isLiveCamera && img.src) {
                ctx.drawImage(img, 0, 0);
            }

            if (points.length > 0) {
                // Gambar garis antar titik secara berurutan
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.strokeStyle = '#32d74b';
                ctx.lineWidth = Math.max(3, canvas.width / 150);
                ctx.stroke();

                // Gambar lingkaran kecil di setiap titik (banyak titik)
                for (let i = 0; i < points.length; i++) {
                    ctx.fillStyle = '#ff453a';
                    ctx.beginPath(); 
                    ctx.arc(points[i].x, points[i].y, Math.max(4, canvas.width / 90), 0, Math.PI * 2); 
                    ctx.fill();
                    
                    // Beri border putih agar titik terlihat jelas
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // Setiap kali layar diklik/disentuh, tambahkan titik baru ke dalam array points
        canvas.addEventListener('click', (e) => {
            if (isLiveCamera) return;
            const pos = getMousePos(e);
            points.push(pos);
            redrawCanvas();
            calculateLength();
        });

        canvas.addEventListener('touchend', (e) => {
            if (isLiveCamera) return;
            // Mencegah klik ganda pada simulasi touch event tertentu
            e.preventDefault();
        }, { passive: false });

        function calculateLength() {
            if (points.length < 2) {
                document.getElementById('pixelDisplay').innerText = `0 px`;
                document.getElementById('resultDisplay').innerText = `0`;
                return;
            }

            // Hitung total panjang piksel dari seluruh segmen garis
            let pixelDist = 0;
            for (let i = 0; i < points.length - 1; i++) {
                const dx = points[i+1].x - points[i].x;
                const dy = points[i+1].y - points[i].y;
                pixelDist += Math.sqrt(dx * dx + dy * dy);
            }

            document.getElementById('pixelDisplay').innerText = `${pixelDist.toFixed(0)} px`;

            const scaleFactor = parseFloat(document.getElementById('scaleFactor').value) || 5;
            let valueInCm = (pixelDist / 100) * scaleFactor;
            
            let finalVal = valueInCm;
            switch(currentUnitKey) {
                case 'mm': finalVal = valueInCm * 10; break;
                case 'cm': finalVal = valueInCm; break;
                case 'm': finalVal = valueInCm / 100; break;
                case 'km': finalVal = valueInCm / 100000; break;
                case 'um': finalVal = valueInCm * 10000; break;
                case 'nm': finalVal = valueInCm * 10000000; break;
                case 'mi': finalVal = valueInCm / 160934; break;
                case 'yd': finalVal = valueInCm / 91.44; break;
                case 'ft': finalVal = valueInCm / 30.48; break;
                case 'in': finalVal = valueInCm / 2.54; break;
            }

            document.getElementById('resultDisplay').innerText = finalVal < 0.001 ? finalVal.toExponential(2) : finalVal.toFixed(2);
        }

        window.onclick = function(event) {
            if (!event.target.closest('.unit-dropdown-btn') && !event.target.closest('.unit-popup')) {
                document.getElementById('unitPopup').style.display = 'none';
            }
        }
    </script>
</body>
</html>
