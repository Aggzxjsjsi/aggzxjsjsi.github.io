<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator Tinggi Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        
        .workspace { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        canvas { z-index: 2; display: none; }

        .header { position: absolute; top: 0; width: 100%; padding: 15px; z-index: 10; display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .btn { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn:active { background: #38bdf8; color: #000; }
        .btn.primary { background: #38bdf8; color: #000; }
        
        .result-badge { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; border: 1px solid #38bdf8; z-index: 10; font-size: 1.2rem; font-weight: bold; color: #38bdf8; text-align: center; }

        /* Lensa Pembesar - Titik merah sudah diperkecil */
        .magnifier { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 2px solid #f43f5e; overflow: hidden; display: none; z-index: 100; transform: translate(-50%, -120px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); background: #000; pointer-events: none; }
        .magnifier canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .magnifier::after {
            content: ''; position: absolute; top: 50%; left: 50%; 
            width: 2px; height: 2px; /* Ukuran titik merah sangat kecil */
            background: #f43f5e; border-radius: 50%; transform: translate(-50%, -50%);
        }

        .camera-ui { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; z-index: 10; gap: 20px; align-items: center; }
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; background: #38bdf8; border: 4px solid #fff; cursor: pointer; }
        .capture-btn:active { transform: scale(0.9); }

        .editor-ui { position: absolute; bottom: 0; width: 100%; background: rgba(15,15,20,0.9); backdrop-filter: blur(10px); padding: 15px; border-top: 1px solid #38bdf8; z-index: 10; display: none; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; justify-content: space-between; }
        .row .btn { flex: 1; text-align: center; }

        .banner { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #000; padding: 5px 15px; border-radius: 20px; z-index: 50; font-size: 0.8rem; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="workspace">
        <video id="videoElement" autoplay playsinline muted></video>
        <canvas id="measCanvas"></canvas>
    </div>

    <div class="header">
        <!-- Diperbaiki: Tidak pakai reload halaman lagi, tapi reset instan -->
        <button class="btn" onclick="resetApp()">🔄 Ulang</button>
        
        <div style="font-weight: bold; color: #fff; align-self: center;">Alat Ukur Pro</div>
        <button class="btn" onclick="calibrate()">⚙️ Kalibrasi</button>
    </div>

    <div class="result-badge" id="resultValue">0.0 cm</div>
    <div class="banner" id="banner">Pesan</div>

    <div class="magnifier" id="magnifier">
        <canvas id="magCanvas" width="150" height="150"></canvas>
    </div>

    <div class="camera-ui" id="cameraUi">
        <button class="btn" onclick="toggleCamera()">🔄 Balik</button>
        <div class="capture-btn" onclick="capturePhoto()"></div>
    </div>

    <div class="editor-ui" id="editorUi">
        <div class="row">
            <button class="btn primary" onclick="addNewLine()">➕ Garis Baru</button>
            <button class="btn" onclick="addPointToCurrentLine()">➕ Titik</button>
        </div>
        <div class="row">
            <button class="btn" onclick="executeRelocateMode()">📍 Pindah Lokasi</button>
            <button class="btn" onclick="deleteLast()" style="background: rgba(244,63,94,0.2); border-color:#f43f5e; color:#f43f5e;">🗑️ Hapus</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('measCanvas');
        const ctx = canvas.getContext('2d');
        const magDiv = document.getElementById('magnifier');
        const magCanvas = document.getElementById('magCanvas');
        const magCtx = magCanvas.getContext('2d');
        const resultValue = document.getElementById('resultValue');

        let lines = [];
        let activeLineIdx = 0;
        let activePointIdx = -1;
        let img = new Image();
        
        let calibrationRefPx = 150; 
        let calibrationScaleCm = 14; 
        let isRelocateActive = false;
        let facingMode = 'environment';
        let draggedPoint = null;

        // Inisialisasi Kamera
        async function startCamera() {
            try {
                if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode, width: {ideal: 1280}, height: {ideal: 720} } 
                });
                video.srcObject = stream;
            } catch (err) {
                showBanner("⚠️ Izinkan akses kamera!");
            }
        }
        startCamera();

        function toggleCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        // FUNGSI BARU: Reset Aplikasi Tanpa Reload Halaman
        function resetApp() {
            // Sembunyikan canvas gambar, tampilkan video
            document.getElementById('editorUi').style.display = 'none';
            document.getElementById('cameraUi').style.display = 'flex';
            canvas.style.display = 'none';
            video.style.display = 'block';

            // Reset data garis & ukuran
            lines = [];
            activeLineIdx = 0;
            activePointIdx = -1;
            calibrationRefPx = 150;
            calibrationScaleCm = 14;
            isRelocateActive = false;
            
            resultValue.innerText = "0.0 cm";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Nyalakan ulang kamera jika mati
            startCamera();
            showBanner("🔄 Kembali ke kamera");
        }

        // Tangkap Foto
        function capturePhoto() {
            canvas.width = video.videoWidth || window.innerWidth;
            canvas.height = video.videoHeight || window.innerHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            img.src = canvas.toDataURL('image/png');
            img.onload = () => {
                video.style.display = 'none';
                canvas.style.display = 'block';
                document.getElementById('cameraUi').style.display = 'none';
                document.getElementById('editorUi').style.display = 'flex';
                
                // Tambah garis pertama otomatis
                lines = [[
                    {x: canvas.width/2 - 75, y: canvas.height/2},
                    {x: canvas.width/2 + 75, y: canvas.height/2}
                ]];
                redraw();
                showBanner("✨ Foto siap diukur!");
            };
        }

        function addNewLine() {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2 + (lines.length * 40);
            let lenPx = (calibrationRefPx && calibrationRefPx > 0) ? calibrationRefPx : 150; 
            
            lines.push([{x: cx - (lenPx/2), y: cy}, {x: cx + (lenPx/2), y: cy}]);
            activeLineIdx = lines.length - 1;
            redraw();
        }

        function addPointToCurrentLine() {
            if (!lines[activeLineIdx]) lines[activeLineIdx] = [];
            let pts = lines[activeLineIdx];
            let last = pts[pts.length - 1] || {x: canvas.width/2, y: canvas.height/2};
            let lenPx = (calibrationRefPx && calibrationRefPx > 0) ? calibrationRefPx : 150; 
            
            pts.push({x: last.x + (lenPx * 0.707), y: last.y + (lenPx * 0.707)}); 
            redraw();
        }

        function executeRelocateMode() {
            isRelocateActive = true;
            showBanner("📍 Ketuk pada layar untuk pindah lokasi garis");
        }

        function deleteLast() {
            if (lines[activeLineIdx] && lines[activeLineIdx].length > 0) {
                lines[activeLineIdx].pop();
                if (lines[activeLineIdx].length === 0) lines.splice(activeLineIdx, 1);
                activeLineIdx = Math.max(0, lines.length - 1);
                redraw();
            }
        }

        function calibrate() {
            let distPx = getDistance(lines[activeLineIdx]?.[0], lines[activeLineIdx]?.[1]);
            if (distPx === 0) { showBanner("⚠️ Butuh minimal 1 garis!"); return; }
            
            let realSize = prompt("Masukkan ukuran asli objek ini (dalam cm):", "14");
            if (realSize && !isNaN(realSize)) {
                calibrationScaleCm = parseFloat(realSize);
                calibrationRefPx = distPx;
                showBanner(`✅ Kalibrasi diatur: ${calibrationScaleCm} cm`);
                redraw();
            }
        }

        function getDistance(p1, p2) {
            if (!p1 || !p2) return 0;
            return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            let totalDist = 0;

            lines.forEach((pts, lIdx) => {
                ctx.beginPath();
                ctx.strokeStyle = lIdx === activeLineIdx ? '#38bdf8' : '#fff';
                ctx.lineWidth = 3;
                
                for(let i=0; i<pts.length; i++) {
                    if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
                    else ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.stroke();

                for(let i=0; i<pts.length; i++) {
                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, 6, 0, 2*Math.PI);
                    ctx.fillStyle = (lIdx === activeLineIdx && i === activePointIdx) ? '#f43f5e' : '#38bdf8';
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (i > 0) {
                        totalDist += getDistance(pts[i-1], pts[i]);
                    }
                }
            });

            if (calibrationRefPx > 0) {
                let ratio = calibrationScaleCm / calibrationRefPx;
                resultValue.innerText = (totalDist * ratio).toFixed(1) + ' cm';
            }
        }

        function updateMagnifier(x, y) {
            magDiv.style.left = x + 'px';
            magDiv.style.top = y + 'px';
            magDiv.style.display = 'block';

            magCtx.clearRect(0, 0, magCanvas.width, magCanvas.height);
            magCtx.drawImage(canvas, x - 37.5, y - 37.5, 75, 75, 0, 0, 150, 150);
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (isRelocateActive) {
                isRelocateActive = false;
                let targetLen = (calibrationRefPx > 0) ? calibrationRefPx : 150;
                
                if (!lines[activeLineIdx]) lines[activeLineIdx] = [];
                let pts = lines[activeLineIdx];

                if (pts.length >= 2) {
                    let angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
                    pts[0] = { x: x, y: y };
                    pts[1] = { x: x + Math.cos(angle) * targetLen, y: y + Math.sin(angle) * targetLen };
                } else {
                    lines[activeLineIdx] = [{x: x - targetLen/2, y: y}, {x: x + targetLen/2, y: y}];
                }
                redraw();
                showBanner("✨ Lokasi dipindah sesuai kalibrasi!");
                return;
            }

            draggedPoint = null;
            for(let l=0; l<lines.length; l++){
                for(let p=0; p<lines[l].length; p++){
                    if (getDistance({x, y}, lines[l][p]) < 30) {
                        activeLineIdx = l;
                        activePointIdx = p;
                        draggedPoint = lines[l][p];
                        updateMagnifier(x, y);
                        redraw();
                        return;
                    }
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!draggedPoint) return;
            const rect = canvas.getBoundingClientRect();
            draggedPoint.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            draggedPoint.y = (e.clientY - rect.top) * (canvas.height / rect.height);
            updateMagnifier(draggedPoint.x, draggedPoint.y);
            redraw();
        });

        canvas.addEventListener('pointerup', () => {
            draggedPoint = null;
            magDiv.style.display = 'none';
        });

        function showBanner(txt) {
            let b = document.getElementById('banner');
            b.innerText = txt;
            b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
