<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pengukur Panjang AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .calc-container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header ala Aplikasi Kalkulator */
        .calc-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #181818;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-icon {
            font-size: 1.2rem;
            color: #e0e0e0;
            cursor: pointer;
            margin-right: 15px;
        }

        .calc-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0e0e0;
            flex-grow: 1;
        }

        .unit-dropdown-btn {
            background: transparent;
            border: none;
            color: #ff9f0a;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Screen Display */
        .calc-display {
            padding: 20px;
            text-align: right;
            background: #181818;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .input-value-display {
            font-size: 1.5rem;
            color: #8e8e93;
            font-weight: 300;
        }

        .result-value-display {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 400;
            margin-top: 5px;
        }

        /* Workspace Canvas Area */
        .workspace {
            position: relative;
            background: #000;
            width: 100%;
            height: 250px;
            display: none;
            overflow: hidden;
            border-top: 1px solid #2c2c2e;
            border-bottom: 1px solid #2c2c2e;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .upload-placeholder {
            padding: 15px 20px;
            background: #1e1e1e;
            text-align: center;
            border-bottom: 1px solid #2c2c2e;
        }

        .upload-label {
            color: #ff9f0a;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
        }

        .upload-label input {
            display: none;
        }

        /* Keypad / Control Panel */
        .control-panel {
            padding: 15px 20px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #8e8e93;
        }

        .control-row input[type="number"] {
            background: #2c2c2e;
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 90px;
            text-align: right;
            font-size: 0.9rem;
            outline: none;
        }

        /* Popup Unit Selection Menu ala Screenshot */
        .unit-popup {
            position: absolute;
            top: 60px;
            left: 15px;
            width: 240px;
            max-height: 350px;
            background: #2c2c2e;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 8px 0;
        }

        .unit-item {
            padding: 12px 20px;
            font-size: 0.9rem;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-item:hover {
            background: #3a3a3c;
        }

        .unit-item.active {
            color: #ff9f0a;
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <!-- Header -->
        <div class="calc-header">
            <span class="back-icon">←</span>
            <span class="calc-title">Panjang</span>
            <button class="unit-dropdown-btn" onclick="toggleUnitMenu()">
                <span id="currentUnitLabel">Sentimeter cm</span> ▾
            </button>
        </div>

        <!-- Popup Menu Satuan (Menyerupai Screenshot Kalkulator) -->
        <div class="unit-popup" id="unitPopup">
            <div class="unit-item" onclick="selectUnit('km', 'Kilometer km')">Kilometer <span>km</span></div>
            <div class="unit-item active" onclick="selectUnit('cm', 'Sentimeter cm')">Sentimeter <span>cm</span></div>
            <div class="unit-item" onclick="selectUnit('m', 'Meter m')">Meter <span>m</span></div>
            <div class="unit-item" onclick="selectUnit('mm', 'Milimeter mm')">Milimeter <span>mm</span></div>
            <div class="unit-item" onclick="selectUnit('um', 'Mikrometer µm')">Mikrometer <span>µm</span></div>
            <div class="unit-item" onclick="selectUnit('nm', 'Nanometer nm')">Nanometer <span>nm</span></div>
            <div class="unit-item" onclick="selectUnit('mi', 'Mil mil')">Mil <span>mil</span></div>
            <div class="unit-item" onclick="selectUnit('yd', 'Yard yd')">Yard <span>yd</span></div>
            <div class="unit-item" onclick="selectUnit('ft', 'Kaki ft')">Kaki <span>ft</span></div>
            <div class="unit-item" onclick="selectUnit('in', 'Inci in')">Inci <span>in</span></div>
            <div class="unit-item" onclick="selectUnit('ly', 'Tahun cahaya ly')">Tahun cahaya <span>ly</span></div>
            <div class="unit-item" onclick="selectUnit('au', 'Satuan astronomis ⊙')">Satuan astronomis <span>⊙</span></div>
        </div>

        <!-- Display Hasil -->
        <div class="calc-display">
            <div class="input-value-display" id="pixelDisplay">0 px</div>
            <div class="result-value-display" id="resultDisplay">0</div>
        </div>

        <!-- Upload Foto / Video -->
        <div class="upload-placeholder">
            <label class="upload-label">
                📷 Pilih Foto / Video Objek Untuk Diukur
                <input type="file" accept="image/*,video/*" id="mediaInput" onchange="handleMedia(event)">
            </label>
        </div>

        <!-- Workspace Area Gambar & Garis Drag -->
        <div class="workspace" id="workspace">
            <canvas id="measCanvas"></canvas>
        </div>

        <!-- Control Panel Skala -->
        <div class="control-panel">
            <div class="control-row">
                <span>Skala (cm per 100px):</span>
                <input type="number" id="scaleFactor" value="5" oninput="calculateLength()">
            </div>
            <div style="font-size: 0.7rem; color: #636366; text-align: center;">
                Tarik garis langsung di atas foto objek untuk mengukur panjangnya.
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('measCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isDrawing = false;
        let startX = 0, startY = 0;
        let endX = 0, endY = 0;
        let hasDrawn = false;
        let currentUnitKey = 'cm';

        function toggleUnitMenu() {
            const popup = document.getElementById('unitPopup');
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function selectUnit(key, label) {
            currentUnitKey = key;
            document.getElementById('currentUnitLabel').innerText = label;
            document.getElementById('unitPopup').style.display = 'none';
            
            // Update active class
            document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            calculateLength();
        }

        function handleMedia(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    document.getElementById('workspace').style.display = 'block';
                    redrawCanvas();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            if (hasDrawn) {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = '#32d74b';
                ctx.lineWidth = Math.max(3, canvas.width / 150);
                ctx.stroke();

                // Titik Awal & Akhir
                ctx.fillStyle = '#ff453a';
                ctx.beginPath(); ctx.arc(startX, startY, canvas.width/100, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(endX, endY, canvas.width/100, 0, Math.PI * 2); ctx.fill();
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            startX = pos.x; startY = pos.y;
            isDrawing = true;
            hasDrawn = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            endX = pos.x; endY = pos.y;
            hasDrawn = true;
            redrawCanvas();
            calculateLength();
        });

        canvas.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            const pos = getMousePos(e);
            startX = pos.x; startY = pos.y;
            isDrawing = true;
            hasDrawn = false;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            endX = pos.x; endY = pos.y;
            hasDrawn = true;
            redrawCanvas();
            calculateLength();
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => { isDrawing = false; });

        function calculateLength() {
            if (!hasDrawn) return;

            const pixelDist = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
            document.getElementById('pixelDisplay').innerText = `${pixelDist.toFixed(0)} px`;

            const scaleFactor = parseFloat(document.getElementById('scaleFactor').value) || 5;
            let valueInCm = (pixelDist / 100) * scaleFactor;
            
            let finalVal = valueInCm;
            switch(currentUnitKey) {
                case 'mm': finalVal = valueInCm * 10; break;
                case 'cm': finalVal = valueInCm; break;
                case 'm': finalVal = valueInCm / 100; break;
                case 'km': finalVal = valueInCm / 100000; break;
                case 'um': finalVal = valueInCm * 10000; break;
                case 'nm': finalVal = valueInCm * 10000000; break;
                case 'mi': finalVal = valueInCm / 160934; break;
                case 'yd': finalVal = valueInCm / 91.44; break;
                case 'ft': finalVal = valueInCm / 30.48; break;
                case 'in': finalVal = valueInCm / 2.54; break;
                case 'ly': finalVal = valueInCm / 9.461e18; break;
                case 'au': finalVal = valueInCm / 1.496e13; break;
            }

            document.getElementById('resultDisplay').innerText = finalVal < 0.001 ? finalVal.toExponential(2) : finalVal.toFixed(2);
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.closest('.unit-dropdown-btn') && !event.target.closest('.unit-popup')) {
                document.getElementById('unitPopup').style.display = 'none';
            }
        }
    </script>
</body>
</html>
