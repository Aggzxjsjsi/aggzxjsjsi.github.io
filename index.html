<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Surveillance HUD</title>
    <style>
        body {
            background-color: #0b0f0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            margin-bottom: 15px;
        }

        .tactical-wrapper {
            border: 2px solid #00ff66;
            background: #111;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            max-width: 640px;
            width: 100%;
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 360px;
            background: #000;
            overflow: hidden;
            border: 1px solid #00ff66;
        }

        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        /* Lapisan Overlay HUD Tambahan */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-sizing: border-box;
            border: 10px solid rgba(0, 255, 102, 0.05);
        }
        
        .hud-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px dashed rgba(0, 255, 102, 0.6);
            border-radius: 50%;
        }

        /* Panel Kontrol Mode Taktis */
        .tactical-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .tactical-controls button {
            background: #002208;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
        }

        .tactical-controls button:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 10px #00ff66;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Efek Termal Pasif: Kontras tinggi dengan palet panas (Invert & Hue) */
        .thermal-mode {
            filter: invert(100%) hue-rotate(180deg) contrast(200%);
        }

        /* Efek Night Vision Pasif: Nuansa hijau fosfor khas penglihatan malam */
        .night-vision-mode {
            filter: sepia(100%) hue-rotate(60deg) saturate(500%) brightness(120%) contrast(150%);
        }

        /* Efek Sensor Ultra-Sensitif: Hitam putih beresolusi tinggi dan terang */
        .ultra-sensitive-mode {
            filter: grayscale(100%) brightness(150%) contrast(200%);
        }
    </style>
</head>
<body>

    <h2>Military Tactical Feed</h2>

    <div class="tactical-wrapper">
        <div class="camera-container">
            <!-- Elemen Video Live dari Kamera Perangkat -->
            <video id="cameraStream" autoplay playsinline muted></video>
            
            <!-- Elemen HUD Taktis -->
            <div class="hud-overlay">
                <div class="hud-crosshair"></div>
            </div>
        </div>
        
        <!-- Panel Kontrol Mode Taktis -->
        <div class="tactical-controls">
            <button class="full-width" onclick="toggleCamera()" id="camToggleBtn">🔄 Kamera: Belakang (Environment)</button>
            <button onclick="setMode('normal')">Sensor Normal</button>
            <button onclick="setMode('thermal')">Termal Pasif</button>
            <button onclick="setMode('nightvision')">Night Vision Pasif</button>
            <button onclick="setMode('ultrasensitive')">Ultra-Sensitif</button>
        </div>
    </div>

    <script>
        let currentFacingMode = 'environment'; // 'environment' untuk kamera belakang, 'user' untuk kamera depan
        let currentStream = null;

        // Fungsi untuk mengaktifkan kamera secara live dengan dukungan pilihan facingMode
        async function initCamera() {
            const videoElement = document.getElementById('cameraStream');
            
            // Hentikan stream kamera sebelumnya jika ada agar tidak bentrok
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    }, 
                    audio: false 
                });
                videoElement.srcObject = currentStream;
            } catch (error) {
                console.error("Gagal mengakses kamera: ", error);
                alert("Tidak dapat mengakses kamera. Pastikan izin kamera aktif dan dibuka via HTTPS/Localhost.");
            }
        }

        // Fungsi untuk tombol ganti kamera (Belakang <-> Depan)
        function toggleCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            const label = currentFacingMode === 'environment' ? 'Belakang (Environment)' : 'Depan (User)';
            document.getElementById('camToggleBtn').innerText = `🔄 Kamera: ${label}`;
            initCamera();
        }

        // Fungsi mengganti mode sensor visual
        function setMode(mode) {
            const stream = document.getElementById('cameraStream');
            
            // Bersihkan semua mode kelas sebelumnya
            stream.className = '';
            
            // Terapkan mode baru sesuai pilihan
            if (mode === 'thermal') {
                stream.classList.add('thermal-mode');
            } else if (mode === 'nightvision') {
                stream.classList.add('night-vision-mode');
            } else if (mode === 'ultrasensitive') {
                stream.classList.add('ultra-sensitive-mode');
            }
        }

        // Jalankan inisialisasi kamera saat halaman dimuat
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
